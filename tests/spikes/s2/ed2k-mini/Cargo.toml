[package]
name = "coldrevive-ed2k-mini"
version = "0.1.0"
edition = "2021"
publish = false
description = "ADR-011 L2 spike: minimal standard eD2k client-to-client TCP stack (download + upload), zero dependencies"

[[bin]]
