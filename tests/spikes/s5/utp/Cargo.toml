[package]
name = "coldrevive-s5-utp-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "S5: real librqbit-utp 0.7.0 stack over a shared shaped bottleneck, measuring foreground TCP degradation"

[dependencies]
librqbit-utp = "0.7.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde_json = "1"
anyhow = "1"

# 独立工程，不属于 ColdRevive 根 workspace（根 workspace 保持 std-only）。
[workspace]
