[package]
name = "coldrevive-s5-utp-netem"
version = "0.1.0"
edition = "2021"
publish = false
description = "S5: real librqbit-utp 0.7.0 over a kernel tc/htb+netem bottleneck (cross-veth), measuring foreground TCP degradation"

[dependencies]
librqbit-utp = "0.7.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde_json = "1"

[workspace]
