# G3 兼容性矩阵客户端版本锁定（docs/05-quality/TEST.md §3）
#
# 规则：executable 为空 = 本机没有可核验的客户端，核验器如实记 blocked，
# 绝不把「没装」写成「通过」。版本由核验器实际执行 `--version` 读取，
# 读不到就写 unknown，不猜。evidence_glob 只指向**已存在**的本机证据文件，
# 命中也只是「有素材」，不等于 G3 pass——G3 全绿由实验执行人手工判定。

version = 1
source = "docs/05-quality/TEST.md §3"

# 远端已实测可用的第三方客户端（2026-11-16，SSH 登录执行 --version 读取）。
# 本机 installs 为空的行，可借这些 LAN 主机取证；readonly 核验器把这类行标为
# runnable_remote，但**仍不判 pass**（G3 全绿须执行人手工回填）。
# 密码/密钥不入库：221/222 用实验室 ed25519，209 用 askpass，均不在此文件。
[[remote_clients]]
row_id = "qbittorrent"
host = "192.168.1.222"
executable = "/usr/bin/qbittorrent-nox"
version_observed = "qBittorrent v4.5.1"
mode = "nox (无 GUI)，种子文件作位置参数自动添加"

[[remote_clients]]
row_id = "transmission"
host = "192.168.1.221"
executable = "/usr/bin/transmission-daemon"
version_observed = "transmission-daemon 3.00 (bb6b5a062e)"
mode = "transmission-remote RPC 驱动"

[[remote_clients]]
row_id = "motrix_aria2"
host = "192.168.1.209"
executable = "C:/Program Files/Rayburst/aria2-next.exe"
version_observed = "aria2-next (Motrix Next 捆绑)"
mode = "--bt-tracker 指向标准 tracker，DHT/LPD 关闭"

[[rows]]
id = "qbittorrent"
client = "qBittorrent"
scenario = "拿 magnet 连接被唤醒的 A，正常下载"
executable = ""
evidence_glob = "tests/e2e/g3/reports/qbittorrent-*.json"

[[rows]]
id = "transmission"
client = "Transmission"
scenario = "导入伴随 .torrent，正常解析与下载"
executable = ""
evidence_glob = "tests/e2e/g3/reports/transmission-*.json"

[[rows]]
id = "bitcomet"
client = "BitComet"
scenario = "标准 handshake + 长效种子共存"
executable = ""
evidence_glob = "tests/e2e/g3/reports/bitcomet-*.json"

[[rows]]
id = "emule_amule"
client = "eMule / aMule"
scenario = "ed2k 链接与 KAD 共存，不污染彼此命名空间"
executable = ""
evidence_glob = "tests/e2e/g3/reports/emule-*.json"

[[rows]]
id = "ariang"
client = "AriaNg"
scenario = "通过 /jsonrpc 管理任务"
executable = ""
evidence_glob = "tests/e2e/g3/reports/ariang-*.json"

[[rows]]
id = "browser_extension"
client = "浏览器插件"
scenario = "推送下载链接到 ColdRevive，任务创建成功"
executable = ""
evidence_glob = "tests/e2e/g3/reports/browser-extension-*.json"

[[rows]]
id = "ui_closed"
client = "关闭 UI 窗口"
scenario = "后台下载/做种不中断"
executable = ""
evidence_glob = "tests/e2e/g3/reports/ui-closed-*.json"

# 已在 S1 留下素材的一行：Motrix Next 捆绑 aria2 1.36.0 作第三方 seeder，
# rqbit cross-lee 拉取 2 MiB、128/128 片 SHA-1 校验通过（S1.cross_client_round）。
[[rows]]
id = "motrix_aria2"
client = "Motrix Next (aria2)"
scenario = "第三方客户端作 seeder，rqbit cross-lee 逐片校验"
executable = "C:/Program Files/Rayburst/aria2-next.exe"
evidence_glob = "tests/spikes/s1/reports/s1-cross-lee-*.json"
evidence_note = "S1 cross_client_round：128/128 片校验；仅回环 TCP，非 G3 全行通过"
