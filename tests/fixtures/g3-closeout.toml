# G3 结案记录（人工判定，不是机器推断）
#
# 为什么不写进 compat-matrix.toml：那是「客户端与素材清单」，由只读核验器读取。
# 本文件是**人的判定**。两者混在一起，脚本就会被动地把人的结论当成自己的输出，
# 以后没人分得清「谁说的、凭什么」。所以分开：
#   - compat-matrix.toml  = 有哪些客户端、有哪些报告（机器可核）
#   - g3-closeout.toml    = 这些素材够不够、按什么口径结案（只有人能定）
#
# 脚本纪律（tests/e2e/g3/compat_matrix.py 的 --self-test 守着）：
#   - 只**转述**本文件，不据此改写自己的机器字段；
#   - 机器字段 g3_status 恒 not_run、evidence_valid_for_pass 恒 false ——
#     意思是「核验器自己没有跑互操作、不主张通过」，与本文件的人工结论互不覆盖；
#   - 本文件缺失时，结案结论就是「没有」，不猜。

schema = "coldrevive.g3.closeout/v1"
authority = "human"
decided_by = "项目所有者"
decided_at = "2026-11-16"
decision = "close_with_exceptions"
gate_status_declared = "closed_with_exceptions"
commitment = "best-effort"

rationale = """
所有者 2026-11-16 决定：先按现状结案，不再为补齐残余边界追加环境改造；以后有机会再测。
所以这里记的是「G3 结案，带 6 条明确例外」，不是「G3 全绿」。
按 ADR-012 口径，本记录不含任何可达率/成功率数字，也不构成 SLA。
"""

# ---------------------------------------------------------------------------
# 逐行判定
#
# verdict 取值（只有这三种，避免出现「大概还行」这类不可核的表述）：
#   accepted              — 该行场景已有真实观测支撑，未发现残余缺口
#   accepted_with_gap     — 场景主路径有真实观测，但存在写明的一处或多处未验证
# 任何一行都不写 pass/通过：矩阵级的结论在 gate_status_declared，这里是证据支撑度。
# ---------------------------------------------------------------------------

[[row_verdict]]
id = "qbittorrent"
verdict = "accepted_with_gap"
observed = "qBittorrent v4.5.1 (nox, 192.168.1.222) 经 221 的 BEP23 tracker 完成 1 MiB 标准 .torrent 全量下载，SHA-1 匹配，seeder uploaded_bytes=1048576"
gap = "喂的是 .torrent 文件而非 magnet 链接；『被唤醒的 A』这一环未参与（seeder 自始至终在线）"

[[row_verdict]]
id = "transmission"
verdict = "accepted"
observed = "transmission-daemon 3.00 (192.168.1.221) 以种子文件为位置参数导入并完成 1 MiB 全量，SHA-1 匹配，seeder 计数交叉印证"
gap = ""

