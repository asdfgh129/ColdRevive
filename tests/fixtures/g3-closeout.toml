[[row_verdict]]
id = "emule_amule"
verdict = "accepted_with_gap"
observed = "aMuleD 2.3.3 经标准 eD2k TCP 4662 交付 262144 B / 25 个 OP_SENDINGPART，独立重算 hash 19f7adef… 与逐字节比较均通过；同一轮 KAD 真实帧并发，重叠 30073 ms，aMule 自述 Kad 状态前后一致"
