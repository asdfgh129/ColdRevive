name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build_docs.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install docs builder dependency
        run: python3 -m pip install markdown
      - name: Build standalone HTML pages
        run: python3 scripts/build_docs.py
      - name: Verify index.html is in sync with Markdown sources
        run: git diff --exit-code -- docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
