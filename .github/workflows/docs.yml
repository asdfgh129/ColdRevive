name: Docs

on:
  push:
    paths: ['docs/**', 'scripts/build_docs.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/build_docs.py', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python3 -m pip install markdown
      - name: Validate docs (front matter + links)
        run: python3 scripts/build_docs.py --check
      - name: Build HTML pages and embed docs into index.html
        run: python3 scripts/build_docs.py
      - name: Verify index.html payload is in sync with Markdown sources
        run: git diff --exit-code -- docs/index.html
      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: coldrevive-docs
          path: docs/
