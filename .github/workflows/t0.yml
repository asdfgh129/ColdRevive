name: T0 / T1 acceptance

on:
  push:
    paths: ['tests/e2e/t0/**', 'tests/e2e/t1/**', 'tests/fixtures/t0/**', 'tests/spikes/**',
            'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/t0.yml']
  pull_request:
    paths: ['tests/e2e/t0/**', 'tests/e2e/t1/**', 'tests/fixtures/t0/**', 'tests/spikes/**',
            'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/t0.yml']
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile and test Cargo workspace (M1 std-only crates)
        run: cargo test --workspace --offline

      - name: Compile T0, T1 and M0 scripts
        run: python3 -m py_compile tests/e2e/t0/*.py tests/e2e/t1/*.py tests/spikes/*.py

      - name: Harness self-check
        run: python3 tests/e2e/t0/t0_harness.py --self-check

      - name: Observation layer must not fabricate values
        run: python3 tests/e2e/t0/t0_cli_selftest.py

      - name: M0 preflight must report blockers honestly
        run: |
          set +e
          python3 tests/spikes/m0_preflight.py --json > /tmp/m0-preflight.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/m0-preflight.json', encoding='utf-8'))
          assert r['g0_ready'] is False, 'CI 未配置真实二进制时不得宣称 G0 工程就绪'
          assert r['t0_real_ready'] is False, '未配置二进制时不得宣称真实链路就绪'

          # Spike 结论只能由实验执行人据证据手工回填；脚本不得自动置 pass。
          # 已由所有者 / 执行人依证据回填的 id 白名单，且必须在 spikes.json 留有证据字段。
          manual_adjudicated = {'S1', 'S2', 'S4', 'S7', 'S8'}
          src = json.load(open('tests/spikes/spikes.json', encoding='utf-8'))
          by_id = {s['id']: s for s in src['spikes']}
          for sid, s in r['spikes'].items():
              status = s['status']
              assert status in ('not_run', 'pass', 'fail', 'fallback'), sid + ' 状态异常: ' + status
              if status != 'not_run':
                  assert sid in manual_adjudicated, sid + ' 不得由脚本自动回填'
                  rec = by_id[sid]
                  assert rec.get('observations') or rec.get('resolution') or rec.get('legal_review'), \
                      sid + ' 缺回填证据'
                  assert status != 'pass' or sid in manual_adjudicated

          # S8 若登记为 pass，必须能追溯到所有者豁免，且不得伪造书面法务意见。
          s8 = by_id['S8']
          if s8['status'] == 'pass':
              legal = s8.get('legal_review') or {}
              assert s8.get('resolution') == 'waived_by_owner', 'S8 pass 必须登记为所有者豁免'
              assert legal.get('status') == 'waived_by_owner', 'S8 法务状态必须标注豁免'
              assert legal.get('written_opinion_received') is False, '不得伪造法务书面意见'
              assert legal.get('residual_risk'), '豁免须保留 R-11 残余风险'
          print('OK: blockers =', r['blockers'])
          PY

      - name: Stub self-test must pass without claiming G1 evidence
        run: |
          python3 tests/e2e/t0/t0_accept.py --self-test
          python3 - <<'PY'
          import glob, json
          path = sorted(glob.glob('tests/e2e/t0/reports/*-stub.json'))[-1]
          report = json.load(open(path, encoding='utf-8'))
          assert report['evidence_valid'] is False, 'stub 结果不得标记为门禁证据'
          assert report['summary']['failed'] == 0
          assert report['summary']['passed'] == report['summary']['total']
          print('OK:', report['summary']['passed'], 'PASS, evidence_valid=false')
          PY

      - name: Real mode stays BLOCKED without M1 binaries on CI
        run: |
          set +e
          python3 tests/e2e/t0/t0_accept.py --mode real > /tmp/t0-real.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'BLOCKED' /tmp/t0-real.log
          echo "OK: no binaries on CI -> real mode blocked with exit code 2"

      - name: T1 self-test must never claim G1 evidence
        run: |
          python3 tests/e2e/t1/t1_accept.py --list
          python3 tests/e2e/t1/t1_accept.py --self-test
          python3 - <<'PY'
          import glob, json
          path = sorted(glob.glob('tests/e2e/t1/reports/*-self-test.json'))[-1]
          r = json.load(open(path, encoding='utf-8'))
          assert r['evidence_valid'] is False, 'T1 stub 不得标记为门禁证据'
          assert r['summary']['failed'] == 0
          assert r['summary']['passed'] == r['summary']['total']
          print('OK:', r['summary']['passed'], 'PASS, evidence_valid=false')
          PY

      - name: T1 real mode stays BLOCKED without two physical hosts
        run: |
          set +e
          python3 tests/e2e/t1/t1_accept.py --mode real > /tmp/t1-real.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'BLOCKED' /tmp/t1-real.log
          python3 - <<'PY'
          import glob, json
          path = sorted(glob.glob('tests/e2e/t1/reports/*-real-*.json'))[-1]
          r = json.load(open(path, encoding='utf-8'))
          assert r['evidence_valid'] is False, '单机 CI 不得产出 T1 门禁证据'
          assert r['environment']['two_distinct_hosts'] is False
          print('OK: T1 real BLOCKED, evidence_valid=false')
          PY

      - name: Upload T0 / T1 reports
        uses: actions/upload-artifact@v4
        with:
          name: coldrevive-acceptance-reports
          path: |
            tests/e2e/t0/reports/
            tests/e2e/t1/reports/
