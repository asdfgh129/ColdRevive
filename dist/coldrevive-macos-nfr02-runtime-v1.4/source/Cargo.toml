[workspace]
resolver = "2"
members = ["src/crates/*", "src/bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/asdfgh129/ColdRevive"

[workspace.dependencies]
# 依赖分层（ADR-015，2026-11-16 项目所有者取消「全局零依赖」）：
#   · 协议 / 信令面（cr-core / cr-hash / cr-torrent / cr-nat / cr-wake / cr-kad / cr-store …）继续 std-only；
#   · 引擎与守护进程（cr-engine / coldrevived）可采用 librqbit + tokio。
# 版本集中写在这里，`Cargo.lock` 入库；验收与 CI 一律 `--offline`（构建不依赖 crates.io 可达性）。
librqbit = "9.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
bytes = "1"

[profile.release]
opt-level = 2
strip = true
