# ColdRevive 默认配置样例（人读样例，**不是**当前守护进程可直接加载的格式）
# 规范说明：docs/04-protocol/CONFIG.md
#
# ⚠ 重要：`coldrevived --config <path>` 走的是 `Json::load`，只认 JSON。把本文件直接传给
#   守护进程会得到「配置载入失败: 非法 JSON 字符 '#'」。当前可用格式见
#   tests/e2e/t0/t0_cli.py 生成的 t0 配置（JSON）与 target/g3/daemon-config.json 的形状。
#   本节以下内容是 TOML 形式的**目标形态**，用于讨论默认值，尚未接线到加载器。
#
# 用法：cp config/coldrevive.example.toml coldrevive.toml，然后按需修改。
#        coldrevive.toml 与 config/local.toml 已被 .gitignore 排除。
# 默认值遵循「最小暴露」原则：仅回环监听、共享目录为空、RPC 需密钥。

[shared]
dirs = ["~/ColdRevive/Shared"]
min_file_size_mb = 1
exclude = ["*.part", "*.crdownload"]

[indexer]
# auto | 262144 | 524288 | 1048576
piece_size = "auto"
torrent_gen_concurrency = 2
max_keywords_per_file = 8

[network]
http_port = 16800
wake_udp_port = 16801
bt_port = 16802
enable_upnp = true
enable_ipv6 = true
# 远程管理需显式改为 "0.0.0.0" 并配置 api.rpc_secret（JSON 配置段；守护进程
# 现在会在绑定任何 socket 前拒绝「非回环 + 无 secret」的启动）。
bind = "127.0.0.1"

[kad]
namespace = "ColdRevive_V1"
# public | private | hybrid
bootstrap_mode = "public"
publish_ttl_sec = 1800
publish_rate = 20

[scheduler]
# 实际加载器字段名是 engine.max_active_seeds（JSON 配置）；本 TOML 仅作讨论样例。
max_active_seeds = 50
# FR-14 空闲自动休眠：**opt-in，0 = 关闭（默认）**。HOT 做种任务空闲满阈值后
# 由唯一入口 `idle::sleep_hot_seeds` 暂停并切回 COLD；影子索引与 KAD 发布 Key 保留，
# 所以休眠后 KAD 仍查得到 ——「查得到」不等于「还在做种」，看 /health.idle。
# 秒级优先项是 engine.idle_sleep_secs（JSON 段），两者同时出现时秒优先。
idle_sleep_minutes = 0
wake_session_ttl_sec = 7200
memory_soft_limit_mb = 100
memory_hard_limit_mb = 200

[qos]
# S5 量测（2026-11-13）：本地模型 0.2 → 20.12%、0.05 → 6.19%、0.02 → 4.03%；
# 真实 librqbit-utp 0.7.0 栈（tests/spikes/s5/utp/）0.2 → 14.82%、0.05 → 4.31%、0.02 → 2.70%。
# NFR-03 要求 ≤5%，故默认值回调为 0.02。源码核实该 uTP 版本只有 CUBIC、无 LEDBAT，
# prefer_utp 不提供低优先级退让，≤5% 目前完全依赖本项令牌桶降级。
# 注意：这只是按实测回调配置，S5.status 仍为 not_run，须 M1/G3 真实拥塞链路实测回填。
background_upload_ratio = 0.02
max_connections_total = 200
prefer_utp = true

[security]
# 为空时强制仅允许回环监听
rpc_secret = ""
wake_rate_per_ip = 5
max_wake_concurrency = 8
cors_allowlist = []

[observability]
log_level = "info"
log_format = "json"
metrics_enabled = true
