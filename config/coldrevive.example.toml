# ColdRevive 默认配置样例
# 规范说明：docs/04-protocol/CONFIG.md
# 用法：cp config/coldrevive.example.toml coldrevive.toml，然后按需修改。
#        coldrevive.toml 与 config/local.toml 已被 .gitignore 排除。
# 默认值遵循「最小暴露」原则：仅回环监听、共享目录为空、RPC 需密钥。

[shared]
dirs = ["~/ColdRevive/Shared"]
min_file_size_mb = 1
exclude = ["*.part", "*.crdownload"]

[indexer]
# auto | 262144 | 524288 | 1048576
piece_size = "auto"
torrent_gen_concurrency = 2
max_keywords_per_file = 8

[network]
http_port = 16800
wake_udp_port = 16801
bt_port = 16802
enable_upnp = true
enable_ipv6 = true
# 远程管理需显式改为 "0.0.0.0" 并配置 security.rpc_secret
bind = "127.0.0.1"

[kad]
namespace = "ColdRevive_V1"
# public | private | hybrid
bootstrap_mode = "public"
publish_ttl_sec = 1800
publish_rate = 20

[scheduler]
max_active_seeds = 50
idle_sleep_minutes = 10
wake_session_ttl_sec = 7200
memory_soft_limit_mb = 100
memory_hard_limit_mb = 200

[qos]
# S5 量测（2026-11-13）：本地模型 0.2 → 20.12%、0.05 → 6.19%、0.02 → 4.03%；
# 真实 librqbit-utp 0.7.0 栈（tests/spikes/s5/utp/）0.2 → 14.82%、0.05 → 4.31%、0.02 → 2.70%。
# NFR-03 要求 ≤5%，故默认值回调为 0.02。源码核实该 uTP 版本只有 CUBIC、无 LEDBAT，
# prefer_utp 不提供低优先级退让，≤5% 目前完全依赖本项令牌桶降级。
# 注意：这只是按实测回调配置，S5.status 仍为 not_run，须 M1/G3 真实拥塞链路实测回填。
background_upload_ratio = 0.02
max_connections_total = 200
prefer_utp = true

[security]
# 为空时强制仅允许回环监听
rpc_secret = ""
wake_rate_per_ip = 5
max_wake_concurrency = 8
cors_allowlist = []

[observability]
log_level = "info"
log_format = "json"
metrics_enabled = true
